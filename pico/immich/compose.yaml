services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:release@sha256:e1981983b1c13f6024b57d72e7ecae3342eed1581201ab09fb248932d86c593a
    container_name: immich-immich-server-1
    restart: unless-stopped
    ports:
      - "2283:2283"
    environment:
      DB_HOSTNAME: immich-database
      DB_DATABASE_NAME: immich
      DB_USERNAME: immich
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOSTNAME: immich-redis
      TZ: Australia/Sydney
    volumes:
      - /media/m2/immich/uploads:/usr/src/app/upload
      - /media/m2/photos:/mnt/media/photos:ro
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "109"   # render (host gid, owns renderD128)
      - "44"    # video
    depends_on:
      - immich-redis
      - immich-database
    healthcheck:
      disable: false

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:release@sha256:14367bfb374b8576ddf49abd67c5ca0190a4c7fcf6303cdad65d7f7bf1a50bc2
    container_name: immich-immich-machine-learning-1
    restart: unless-stopped
    environment:
      TZ: Australia/Sydney
    volumes:
      - /media/m2/immich/ml-cache:/cache

  immich-redis:
    image: redis:8.10-alpine@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3
    container_name: immich-immich-redis-1
    restart: unless-stopped
    environment:
      TZ: Australia/Sydney
    healthcheck:
      test: redis-cli ping || exit 1

  immich-database:
    image: ghcr.io/immich-app/postgres:16-vectorchord0.3.0-pgvectors0.2.0@sha256:5b434f184ec644c4e1a4076e2e7d4bee45631646a52e956b5ff74ac51e79cc00
    container_name: immich-immich-database-1
    restart: unless-stopped
    environment:
      POSTGRES_DB: immich
      POSTGRES_USER: immich
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: --data-checksums
      TZ: Australia/Sydney
    volumes:
      - /media/m2/immich/database:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready --dbname=$${POSTGRES_DB} --username=$${POSTGRES_USER} || exit 1
      interval: 15s
      timeout: 5s
      retries: 5
