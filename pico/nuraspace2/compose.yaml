version: '3.5'

services:
  nuraspace:
    image: nuraspace  # Built manually and kept local currently due to credentials
    ports:
      - 8111:5000
    environment:
      TZ: Australia/Sydney
    restart: unless-stopped
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/livez', timeout=5).close()"]
      interval: 30s
      timeout: 6s
      start_period: 60s
      retries: 3
    volumes:
      - /var/nura:/var/nura
      - /etc/localtime:/etc/localtime:ro
