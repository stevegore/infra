version: '3.5'

services:
  nuraspace:
    # Built by stevegore/deskbooking CI (private GHCR package; no secrets in
    # the image). Renovate bumps the digest outside the 05:50-06:00 race and
    # 19:00-20:00 advance windows; Portainer pulls with the ghcr-stevegore
    # credential.
    image: ghcr.io/stevegore/nuraspace:latest@sha256:dba976c893ce5080ea698bc6bbc6d36d26ec3061235eab20a17f7c7570b6ad73
    ports:
      - 8111:5000
    environment:
      TZ: Australia/Sydney
      PUSHOVER_API_TOKEN: ${PUSHOVER_API_TOKEN}
      PUSHOVER_USER_TOKEN: ${PUSHOVER_USER_TOKEN}
    restart: unless-stopped
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/livez', timeout=5).close()"]
      interval: 30s
      timeout: 6s
      start_period: 60s
      retries: 3
    volumes:
      - /var/nura:/var/nura
      - /etc/localtime:/etc/localtime:ro
