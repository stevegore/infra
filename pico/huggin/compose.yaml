version: '3'

services:
  mysql:
    # MySQL 5.7 data cannot be upgraded directly to current MySQL. Keep this
    # major pinned until a staged 5.7 -> 8.0 logical migration is performed.
    image: mysql:5.7@sha256:4bc6bc963e6d8443453676cae56536f4b8156d78bae03c0145cbe47c2aad73bb
    restart: always
    environment:
      - MYSQL_PORT_3306_TCP_ADDR=mysql
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysqldata:/var/lib/mysql

  web:
    image: ghcr.io/huginn/huginn-single-process@sha256:099a46abca3acb28f3af78cb579737cbe569c2eb340b2d37de911105c0d62703
    restart: always
    ports:
      - "3000:3000"
    environment:
      - MYSQL_PORT_3306_TCP_ADDR=mysql
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}    
      - HUGINN_DATABASE_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - HUGINN_DATABASE_USERNAME=root
      - HUGINN_DATABASE_NAME=huginn
      - APP_SECRET_TOKEN=${APP_SECRET_TOKEN}
      - TZ=Australia/Sydney
    depends_on:
      - mysql
    volumes:
      - /etc/localtime:/etc/localtime:ro

  threaded:
    image: ghcr.io/huginn/huginn-single-process@sha256:099a46abca3acb28f3af78cb579737cbe569c2eb340b2d37de911105c0d62703
    command: /scripts/init bin/threaded.rb
    restart: always
    environment:
      - MYSQL_PORT_3306_TCP_ADDR=mysql
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}    
      - HUGINN_DATABASE_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - HUGINN_DATABASE_USERNAME=root
      - HUGINN_DATABASE_NAME=huginn
      - APP_SECRET_TOKEN=${APP_SECRET_TOKEN}
      - TZ=Australia/Sydney
    depends_on:
      - mysql
      - web
    volumes:
      - /etc/localtime:/etc/localtime:ro


  mysqladmin:
    image: phpmyadmin@sha256:62a50b1419fe55b9b4c3cd6f5aed03a18f8f5b4a236f24735d76400bea75a5ff
    restart: always
    ports:
      - "3011:80"
    depends_on:
      - mysql
    environment:
      - PMA_HOST=mysql
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}

volumes:
  mysqldata:
