version: '3'

services:
  mysql:
    # MySQL 5.7 data cannot be upgraded directly to current MySQL. Keep this
    # major pinned until a staged 5.7 -> 8.0 logical migration is performed.
    image: mysql:5.7@sha256:4bc6bc963e6d8443453676cae56536f4b8156d78bae03c0145cbe47c2aad73bb
    restart: always
    environment:
      - MYSQL_PORT_3306_TCP_ADDR=mysql
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysqldata:/var/lib/mysql

  web:
    image: ghcr.io/huginn/huginn-single-process@sha256:857b629e55e4a5f090aaba17a0767fcbf38a29bd825169b94265d8d44d16d2d9
    restart: always
    ports:
      - "3000:3000"
    environment:
      - MYSQL_PORT_3306_TCP_ADDR=mysql
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}    
      - HUGINN_DATABASE_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - HUGINN_DATABASE_USERNAME=root
      - HUGINN_DATABASE_NAME=huginn
      - APP_SECRET_TOKEN=${APP_SECRET_TOKEN}
      - TZ=Australia/Sydney
    depends_on:
      - mysql
    volumes:
      - /etc/localtime:/etc/localtime:ro

  threaded:
    image: ghcr.io/huginn/huginn-single-process@sha256:857b629e55e4a5f090aaba17a0767fcbf38a29bd825169b94265d8d44d16d2d9
    command: /scripts/init bin/threaded.rb
    restart: always
    environment:
      - MYSQL_PORT_3306_TCP_ADDR=mysql
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}    
      - HUGINN_DATABASE_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - HUGINN_DATABASE_USERNAME=root
      - HUGINN_DATABASE_NAME=huginn
      - APP_SECRET_TOKEN=${APP_SECRET_TOKEN}
      - TZ=Australia/Sydney
    depends_on:
      - mysql
      - web
    volumes:
      - /etc/localtime:/etc/localtime:ro


  mysqladmin:
    image: phpmyadmin@sha256:7ebeef41095cbe071a00e3c85c8b44309f110eee546c7b3a6d1fcfe259d58e59
    restart: always
    ports:
      - "3011:80"
    depends_on:
      - mysql
    environment:
      - PMA_HOST=mysql
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}

volumes:
  mysqldata:
