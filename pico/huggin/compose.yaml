version: '3'

services:
  mysql:
    # MySQL 5.7 data cannot be upgraded directly to current MySQL. Keep this
    # major pinned until a staged 5.7 -> 8.0 logical migration is performed.
    image: mysql:5.7@sha256:4bc6bc963e6d8443453676cae56536f4b8156d78bae03c0145cbe47c2aad73bb
    restart: always
    environment:
      - MYSQL_PORT_3306_TCP_ADDR=mysql
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysqldata:/var/lib/mysql

  web:
    image: ghcr.io/huginn/huginn-single-process@sha256:5112b52f2c9f34cb632024c8e8ad564b1b31a741e537bd827e8e99edb00634df
    restart: always
    ports:
      - "3000:3000"
    environment:
      - MYSQL_PORT_3306_TCP_ADDR=mysql
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}    
      - HUGINN_DATABASE_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - HUGINN_DATABASE_USERNAME=root
      - HUGINN_DATABASE_NAME=huginn
      - APP_SECRET_TOKEN=${APP_SECRET_TOKEN}
      - TZ=Australia/Sydney
    depends_on:
      - mysql
    volumes:
      - /etc/localtime:/etc/localtime:ro

  threaded:
    image: ghcr.io/huginn/huginn-single-process@sha256:5112b52f2c9f34cb632024c8e8ad564b1b31a741e537bd827e8e99edb00634df
    command: /scripts/init bin/threaded.rb
    restart: always
    environment:
      - MYSQL_PORT_3306_TCP_ADDR=mysql
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}    
      - HUGINN_DATABASE_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - HUGINN_DATABASE_USERNAME=root
      - HUGINN_DATABASE_NAME=huginn
      - APP_SECRET_TOKEN=${APP_SECRET_TOKEN}
      - TZ=Australia/Sydney
    depends_on:
      - mysql
      - web
    volumes:
      - /etc/localtime:/etc/localtime:ro


  mysqladmin:
    image: phpmyadmin@sha256:9e915766488a0f603183367a4b51f5db6309ea801f3eaa25138a83815772b14f
    restart: always
    ports:
      - "3011:80"
    depends_on:
      - mysql
    environment:
      - PMA_HOST=mysql
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}

volumes:
  mysqldata:
