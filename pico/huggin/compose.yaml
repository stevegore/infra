version: '3'

services:
  mysql:
    # MySQL 5.7 data cannot be upgraded directly to current MySQL. Keep this
    # major pinned until a staged 5.7 -> 8.0 logical migration is performed.
    image: mysql:5.7@sha256:4bc6bc963e6d8443453676cae56536f4b8156d78bae03c0145cbe47c2aad73bb
    restart: always
    environment:
      - MYSQL_PORT_3306_TCP_ADDR=mysql
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysqldata:/var/lib/mysql

  web:
    image: ghcr.io/huginn/huginn-single-process@sha256:7c49e6baa3a19cf80ac7f3909c268a47e803ed99f153dc7b25f3cdd4d7b3daaf
    restart: always
    ports:
      - "3000:3000"
    environment:
      - MYSQL_PORT_3306_TCP_ADDR=mysql
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}    
      - HUGINN_DATABASE_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - HUGINN_DATABASE_USERNAME=root
      - HUGINN_DATABASE_NAME=huginn
      - APP_SECRET_TOKEN=${APP_SECRET_TOKEN}
    depends_on:
      - mysql
    volumes:
      - /etc/timezone:/etc/timezone
      - /etc/localtime:/etc/localtime      

  threaded:
    image: ghcr.io/huginn/huginn-single-process@sha256:7c49e6baa3a19cf80ac7f3909c268a47e803ed99f153dc7b25f3cdd4d7b3daaf
    command: /scripts/init bin/threaded.rb
    restart: always
    environment:
      - MYSQL_PORT_3306_TCP_ADDR=mysql
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}    
      - HUGINN_DATABASE_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - HUGINN_DATABASE_USERNAME=root
      - HUGINN_DATABASE_NAME=huginn
      - APP_SECRET_TOKEN=${APP_SECRET_TOKEN}
    depends_on:
      - mysql
      - web
    volumes:
      - /etc/timezone:/etc/timezone
      - /etc/localtime:/etc/localtime      


  mysqladmin:
    image: phpmyadmin@sha256:6db6e0bc9959eb00395f5d927cc786cb63530a265663950ecb9faf5955419c37
    restart: always
    ports:
      - "3011:80"
    depends_on:
      - mysql
    environment:
      - PMA_HOST=mysql
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}

volumes:
  mysqldata:
