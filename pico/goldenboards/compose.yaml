version: '3.5'

services:
  goldenboards:
    # Built by stevegore/goldenboards CI (private GHCR package). Renovate
    # bumps the digest; Portainer pulls with the ghcr-stevegore credential.
    image: ghcr.io/stevegore/goldenboards:latest@sha256:3c1491abdc42c44829428e04533b817910d43e2804197f7c7d25387322f0a1ad
    environment:
      TZ: Australia/Sydney
    restart: unless-stopped
    volumes:
      - /var/goldenboards:/var/goldenboards    
      - /etc/localtime:/etc/localtime:ro
    
