version: '3.5'

services:
  goldenboards:
    # Built by stevegore/goldenboards CI (private GHCR package). Renovate
    # bumps the digest; Portainer pulls with the ghcr-stevegore credential.
    image: ghcr.io/stevegore/goldenboards:latest@sha256:5212779661c004cdf5da0f5f6c943e21a8a2b96126100f236d25fc01ac7173d1
    environment:
      TZ: Australia/Sydney
    restart: unless-stopped
    volumes:
      - /var/goldenboards:/var/goldenboards    
      - /etc/localtime:/etc/localtime:ro
    
