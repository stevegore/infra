services:
  portainer:
    image: portainer/portainer-ee:2.44.0@sha256:b4fae119badb82a5361906683d6962a5fe5fe57181b07e1a803611b2bacb5b72
    environment:
      TZ: Australia/Sydney
    network_mode: host
    restart: always
    volumes:
      - /run/docker.sock:/var/run/docker.sock
      - /etc/timezone:/etc/timezone
      - /etc/localtime:/etc/localtime
      - portainer_data:/data

volumes:
  portainer_data:
    external: true
