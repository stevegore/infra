services:
  portainer:
    # Reconciled to the tag actually running on pico. Git previously pinned
    # 2.39.5 while the host had been moved to 2.39.7 out of band, so deploying
    # from this file would have downgraded the binary against an already
    # migrated portainer_data DB.
    image: portainer/portainer-ee:2.45.0@sha256:18750221de87f489fffc3d52a23799e9c6a83aab0f1a5337824c81e12bf552b5
    network_mode: host
    restart: always
    volumes:
      - /run/docker.sock:/var/run/docker.sock
      # Deliberately NO TZ env var here. This image ships no zoneinfo, so a
      # named zone like Australia/Sydney cannot be resolved and the runtime
      # falls back to UTC -- and because TZ takes precedence, setting it also
      # defeats this bind. That is exactly what was happening: Portainer had
      # TZ=Australia/Sydney set and was timestamping in UTC regardless.
      # With TZ unset, the bind alone gives the correct local time.
      # /etc/timezone is not mounted: Ubuntu 26.04's tzdata dropped that file.
      - /etc/localtime:/etc/localtime:ro
      - portainer_data:/data

volumes:
  portainer_data:
    external: true
