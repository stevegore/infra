version: '2'
services:
  plex:
    container_name: plex
    image: plexinc/pms-docker:1.43.5.11079-b3b13e506@sha256:6d778d41daae68f89115aa87a44ae14a96b23e71a2093da173b5a9aac4091336  # https://hub.docker.com/r/plexinc/pms-docker/tags
    restart: unless-stopped
    ports:
      - 32400:32400/tcp
      - 3005:3005/tcp
      - 8324:8324/tcp
      - 32469:32469/tcp
      - 32410:32410/udp
      - 32412:32412/udp
      - 32413:32413/udp
      - 32414:32414/udp
    environment:
      - TZ=Australia/Sydney
      - PLEX_CLAIM=${PLEX_CLAIM}
      - ADVERTISE_IP=https://plex.stevegore.au:443
      - ALLOWED_NETWORKS=192.168.0.0/16,10.0.0.0/8
      # - NVIDIA_VISIBLE_DEVICES=all
    hostname: PlexOnPico
    volumes:
      - plex-config:/config
      - plex-temp:/transcode
      - /srv/tv:/data/tv
      - /srv/movies:/data/movies
      - /dev/bus/usb:/dev/bus/usb

volumes:
  plex-config:
  plex-temp:
