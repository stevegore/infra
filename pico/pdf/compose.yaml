services:
  stirling-pdf:
    image: frooodle/s-pdf:latest@sha256:c6872dd056b0046a14c5de1e9970283e7f1e1ff685bb08090c6b37a231127d31
    container_name: pdf-stirling-pdf-1
    restart: unless-stopped
    ports:
      - "8083:8080"
    environment:
      DOCKER_ENABLE_SECURITY: "false"
      INSTALL_BOOK_AND_ADVANCED_HTML_OPS: "false"
      LANGS: en_GB
    volumes:
      - stirling-pdf-config:/configs

volumes:
  stirling-pdf-config:
