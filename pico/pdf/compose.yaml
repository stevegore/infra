services:
  stirling-pdf:
    image: frooodle/s-pdf:latest@sha256:f95b691c3df463373258e21a578b404f1eb4c7660e8170a40e3e03c9c8f208a4
    container_name: pdf-stirling-pdf-1
    restart: unless-stopped
    ports:
      - "8083:8080"
    environment:
      DOCKER_ENABLE_SECURITY: "false"
      INSTALL_BOOK_AND_ADVANCED_HTML_OPS: "false"
      LANGS: en_GB
    volumes:
      - stirling-pdf-config:/configs

volumes:
  stirling-pdf-config:
