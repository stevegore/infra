services:
  stirling-pdf:
    image: frooodle/s-pdf:latest@sha256:b5b9e400c086e5334a4947a0d7cd589808f743f29267d7f41c18200cf4bc48b4
    container_name: pdf-stirling-pdf-1
    restart: unless-stopped
    ports:
      - "8083:8080"
    environment:
      DOCKER_ENABLE_SECURITY: "false"
      INSTALL_BOOK_AND_ADVANCED_HTML_OPS: "false"
      LANGS: en_GB
    volumes:
      - stirling-pdf-config:/configs

volumes:
  stirling-pdf-config:
