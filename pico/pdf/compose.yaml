services:
  stirling-pdf:
    image: frooodle/s-pdf:latest@sha256:c195925341aa35ee5932d9c225edef48a92e46a1280963180d79619cb5f29e6e
    container_name: pdf-stirling-pdf-1
    restart: unless-stopped
    ports:
      - "8083:8080"
    environment:
      DOCKER_ENABLE_SECURITY: "false"
      INSTALL_BOOK_AND_ADVANCED_HTML_OPS: "false"
      LANGS: en_GB
    volumes:
      - stirling-pdf-config:/configs

volumes:
  stirling-pdf-config:
