version: "3.3"
services:
  transmission:
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    volumes:
      - "/var/lib/transmission/:/data"
      - "transmission-config:/config" # Holds transmission-home (was the deprecated /data/transmission-home)
    environment:
      - OPENVPN_PROVIDER=WINDSCRIBE
      - OPENVPN_CONFIG=Sydney-Squidney-udp # From https://github.com/haugene/vpn-configs-contrib
      - OPENVPN_USERNAME=${OPENVPN_USERNAME} # Credentials from https://windscribe.net/getconfig/openvpn
      - OPENVPN_PASSWORD=${OPENVPN_PASSWORD}
      - LOCAL_NETWORK=10.20.30.0/24
      - TRANSMISSION_DOWNLOAD_QUEUE_SIZE=50
    logging:
      driver: json-file
      options:
        max-size: 10m
    networks:
      - transmission
    ports:
      - "9093:9091"
    image: haugene/transmission-openvpn:5.5@sha256:18e5789dfd8aa9c95506d8bf2e4ef88ccd5e4c6102fb75b43f488cb5d5e4dcc5
    sysctls:
      - "net.ipv6.conf.all.disable_ipv6=0"
    security_opt:
      - seccomp:unconfined
  transmission-proxy:
    image: haugene/transmission-openvpn-proxy:5.5@sha256:349695330df6740708b6232fb27a723fcff38333ca5f90141297419d871c5186
    restart: unless-stopped
    networks:
      - transmission
    ports:
      - "9092:8080"

networks:
  transmission:
    external: true
    name: transmission_net

volumes:
  transmission-config:
