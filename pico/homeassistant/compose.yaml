name: homeassistant

services:
  homeassistant-db:
    # 13.0.2 since 2026-10-28, reached stepwise 11.8.9 -> 12.3.3 -> 13.0.2 with
    # HA stopped, a cold datadir archive first
    # (/media/m2/backups/ha-mariadb-pre-13-20261028/) and CHECK TABLE after.
    # (A direct 11.8 -> 12.3 bump, PR #46, was merged unreviewed and reverted on
    # 2026-09-05.) MARIADB_AUTO_UPGRADE below makes the entrypoint run
    # mariadb-upgrade on a version change; still take majors one at a time and
    # deploy them by hand from /opt/ha-container after a backup.
    image: mariadb:13.0.2@sha256:d4fdec0510ad498e4f3127da30a99df3745bd6d5e611ae6ac5f76403d9284a8d
    container_name: homeassistant-db
    restart: unless-stopped
    command: >-
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    environment:
      MARIADB_ROOT_PASSWORD: ${HA_DB_ROOT_PASSWORD}
      MARIADB_DATABASE: homeassistant
      MARIADB_USER: homeassistant
      MARIADB_PASSWORD: ${HA_DB_PASSWORD}
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - /opt/ha-container/dbdata:/var/lib/mysql
    ports:
      - "127.0.0.1:3307:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  homeassistant-matter:
    # Keep the stable channel auditable: Renovate updates the digest by PR.
    image: ghcr.io/home-assistant-libs/python-matter-server:stable@sha256:170aa093ce91c76cde4cc390918307590f0f5558fcec93f913af3cb019e6562a
    container_name: homeassistant-matter
    restart: unless-stopped
    network_mode: host
    command:
      - "--storage-path"
      - "/data"
      - "--paa-root-cert-dir"
      - "/data/credentials"
      - "--fabricid"
      - "2"
      - "--vendorid"
      - "4939"
    security_opt:
      - apparmor=unconfined
    cap_add:
      - NET_ADMIN
    volumes:
      - /opt/ha-container/matter-data:/data
      - /run/dbus:/run/dbus:ro

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.10.4@sha256:23f4dfbb69ce76315dbc4de7915504f1c2dcecd7ca2648113a493a385972e133
    container_name: homeassistant-app
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    security_opt:
      - apparmor=unconfined
    environment:
      TZ: Australia/Sydney
      HA_DB_URL: ${HA_DB_URL}
    volumes:
      - /opt/ha-container/config:/config
      - /run/dbus:/run/dbus
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      homeassistant-db:
        condition: service_healthy
      homeassistant-matter:
        condition: service_started
