version: '3'
services:
 radarr:
  container_name: radarr
  restart: unless-stopped
  networks:
  - transmission_net
  ports:
   - 7878:7878
  volumes:
   - radarr-config:/config
   - /var/lib/transmission:/data
   - /srv/movies:/movies
  environment:
   - TZ=Australia/Sydney
  image: linuxserver/radarr:6.4.4@sha256:fc0ae3c50f8128b97e84381903ec8d6845c3a569641cb7117c124376cccb57c1 # https://hub.docker.com/r/linuxserver/radarr/tags
 
 sonarr:
  container_name: sonarr
  restart: unless-stopped
  networks:
  - transmission_net
  ports:
   - 8989:8989
  volumes:
   - sonarr-config:/config
   - /var/lib/transmission:/data
   - /srv/tv:/tv
  environment:
   - TZ=Australia/Sydney
  image: linuxserver/sonarr:4.0.20@sha256:386c962ee6e260e3a5656b25df2ed056bcc9b6410e197d075f9547fd14c23bca  # https://hub.docker.com/r/linuxserver/sonarr/tags
 
 jackett:
  container_name: jackett
  restart: unless-stopped
  networks:
  - transmission_net
  ports:
   - 9117:9117
  volumes:
   - jackett-config:/config
  environment:
   - TZ=Australia/Sydney
  image: linuxserver/jackett:0.24.2934@sha256:26a50a0f84d018e384d6200f97f44d6498f953484dd9d315a6dcab05b659f16d  # https://hub.docker.com/r/linuxserver/jackett/tags

 flaresolverr:
  container_name: flaresolverr
  restart: unless-stopped
  networks:
  - transmission_net
  ports:
   - 8191:8191
  environment:
   - LOG_LEVEL=info
   - LOG_HTML=false
   - CAPTCHA_SOLVER=none
   - TZ=Australia/Sydney
  image: ghcr.io/flaresolverr/flaresolverr:latest@sha256:c80ae007ce2ccdcd217a12426e4f039ef763ff90738c808d38810c3e59323767
 
volumes:
  radarr-config:
  sonarr-config:
  jackett-config:

networks:
  transmission_net:
    external: true
