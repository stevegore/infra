version: '3'
services:
 radarr:
  container_name: radarr
  restart: unless-stopped
  networks:
  - transmission_net
  ports:
   - 7878:7878
  volumes:
   - radarr-config:/config
   - /var/lib/transmission:/data
   - /srv/movies:/movies
  environment:
   - TZ=Australia/Sydney
  image: linuxserver/radarr:6.3.0 # https://hub.docker.com/r/linuxserver/radarr/tags
 
 sonarr:
  container_name: sonarr
  restart: unless-stopped
  networks:
  - transmission_net
  ports:
   - 8989:8989
  volumes:
   - sonarr-config:/config
   - /var/lib/transmission:/data
   - /srv/tv:/tv
  environment:
   - TZ=Australia/Sydney
  image: linuxserver/sonarr:4.0.19  # https://hub.docker.com/r/linuxserver/sonarr/tags
 
 jackett:
  container_name: jackett
  restart: unless-stopped
  networks:
  - transmission_net
  ports:
   - 9117:9117
  volumes:
   - jackett-config:/config
  environment:
   - TZ=Australia/Sydney
  image: linuxserver/jackett:0.24.2531@sha256:ef4b5b9f09d0c014f48c8e6999abb782b53b4cea8b170ca049c96046950c8524  # https://hub.docker.com/r/linuxserver/jackett/tags

 flaresolverr:
  container_name: flaresolverr
  restart: unless-stopped
  networks:
  - transmission_net
  ports:
   - 8191:8191
  environment:
   - LOG_LEVEL=info
   - LOG_HTML=false
   - CAPTCHA_SOLVER=none
   - TZ=Australia/Sydney
  image: ghcr.io/flaresolverr/flaresolverr:latest
 
volumes:
  radarr-config:
  sonarr-config:
  jackett-config:

networks:
  transmission_net:
    external: true
