name: Renovate

# Self-hosted Renovate. Keeps every pinned version in this repo current:
#   apps/*/Chart.yaml     upstream Helm chart deps      (helmv3)
#   apps/*/values.yaml    image repository/tag pairs    (helm-values + regex)
#   pico/*/compose.yaml   Portainer stack images        (docker-compose)
#   .github/workflows/*   action versions               (github-actions)
#
# Policy lives in renovate.json, not here: routine upgrades self-merge after
# validation; stateful and coordinated upgrades wait for manual review.
#
# Once a PR merges to main the existing pipelines take over with no extra glue:
#   apps/**  -> argocd-sync.yml fires an immediate ArgoCD sync
#   pico/**  -> Portainer polls this repo (5 min) and redeploys the stack
#
# Auth: repo secret RENOVATE_TOKEN — a fine-grained PAT scoped to stevegore/infra
# with Contents, Pull requests, Workflows, Issues and Commit statuses: read+write.
#   Issues: the Dependency Dashboard (issue #9) — without it the dashboard froze.
#   Commit statuses: minimumReleaseAge posts a renovate/stability-days status;
#   a 403 there is misreported as "Repository has changed during renovation -
#   aborting", so any package with a soak (Portainer) never gets its PR.
# (GITHUB_TOKEN is deliberately not used: PRs it opens cannot self-merge.)
#
# Alternative if you would rather not hold a PAT: install the Mend Renovate
# GitHub App at https://github.com/apps/renovate and delete this workflow —
# renovate.json is read identically either way.

on:
  schedule:
    - cron: '0 15 * * *' # 01:00 Australia/Sydney (AEDT) — renovate.json narrows further
  push:
    branches: [main]
    paths:
      - 'renovate.json'
      - '.github/workflows/renovate.yml'
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Renovate log level'
        required: false
        default: 'info'
        type: choice
        options: [info, debug]
      dryRun:
        description: 'Dry run — resolve updates but open no PRs'
        required: false
        default: false
        type: boolean
      ignoreSchedule:
        description: 'Ignore the 1am-6am window and act now'
        required: false
        default: false
        type: boolean
  # Ticking a Dependency Dashboard checkbox edits the issue. The Mend app reacts
  # to that; self-hosted Renovate only would at the next 01:00 run, which reads
  # as "nothing happened". The gate job below runs Renovate only for a new tick.
  issues:
    types: [edited]

permissions:
  contents: read

jobs:
  gate:
    # Loop guard. RENOVATE_TOKEN is Steve's PAT, so Renovate's own dashboard
    # rewrites arrive as edits by the same sender as a human tick — the sender
    # can't tell them apart. The checkbox count can: a human tick adds an [x];
    # Renovate only ever clears them (after acting) or rewrites unticked boxes.
    if: github.event_name != 'issues' || contains(github.event.issue.title, 'dashboard')
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          NEW_BODY: ${{ github.event.issue.body }}
          OLD_BODY: ${{ github.event.changes.body.from }}
        run: |
          if [ "$EVENT" != issues ]; then echo run=true >> "$GITHUB_OUTPUT"; exit 0; fi
          new=$(printf '%s' "$NEW_BODY" | grep -c -- '- \[x\]' || true)
          old=$(printf '%s' "$OLD_BODY" | grep -c -- '- \[x\]' || true)
          echo "ticked boxes: $old -> $new"
          [ "$new" -gt "$old" ] && echo run=true >> "$GITHUB_OUTPUT" || echo run=false >> "$GITHUB_OUTPUT"

  renovate:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    # Job-level, not workflow-level: at workflow level every no-op gate run
    # from Renovate's own dashboard edit would queue here and could replace a
    # pending run that a real tick started.
    concurrency:
      group: renovate
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate renovate.json
        # Fails fast on a malformed config instead of letting Renovate silently
        # fall back to defaults and open a surprising pile of PRs.
        # Pinned: an unpinned `npx renovate` can resolve a years-old cached
        # major that rejects current config keys (managerFilePatterns et al).
        # Renovate keeps this in step with the action version below.
        run: npx --yes --package renovate@44.4.5 -- renovate-config-validator --strict

      - name: Docker Hub host rules
        # Authenticated Docker Hub. Anonymous tag listing stops at 1000 tags
        # (403 "pagination offset too large"); portainer-ee has ~1600, so
        # Renovate lost every releaseTimestamp for it and minimumReleaseAge
        # held each release as pending forever (stuck on 2.45.1, 2026-10).
        #
        # Two hosts, two auth schemes. The registry (docker.io) takes the PAT
        # as Basic auth. The tags API (hub.docker.com) 403s Basic+PAT and only
        # accepts a Bearer JWT from /v2/auth/token (verified 2026-10-22), so
        # mint one per run. Best-effort: if the exchange fails, Renovate still
        # runs, just with Portainer stuck as before.
        # Source of truth: Vault kv/docker; mirrored to these repo secrets.
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_PAT: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          jwt=$(curl -fsS -X POST https://hub.docker.com/v2/auth/token \
                  -H 'Content-Type: application/json' \
                  -d "$(jq -nc --arg i "$DH_USER" --arg s "$DH_PAT" '{identifier:$i,secret:$s}')" \
                | jq -r '.access_token // empty') || jwt=
          if [ -n "$jwt" ]; then
            echo "::add-mask::$jwt"
            rules=$(jq -nc --arg u "$DH_USER" --arg p "$DH_PAT" --arg t "$jwt" \
              '[{hostType:"docker",matchHost:"docker.io",username:$u,password:$p},
                {hostType:"docker",matchHost:"hub.docker.com",token:$t}]')
          else
            echo "::warning::Docker Hub JWT exchange failed; hub.docker.com tag listing stays anonymous"
            rules=$(jq -nc --arg u "$DH_USER" --arg p "$DH_PAT" \
              '[{hostType:"docker",matchHost:"docker.io",username:$u,password:$p}]')
          fi
          echo "RENOVATE_HOST_RULES=$rules" >> "$GITHUB_ENV"

      - uses: renovatebot/github-action@a63d9a7bc606f7336fd20b47f2f32259a35e6213 # v46.3.9
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_PLATFORM: github
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_REQUIRE_CONFIG: 'required'
          # Renovate needs the real base branch, not a fork workflow.
          RENOVATE_GIT_AUTHOR: 'Renovate Bot <bot@renovateapp.com>'
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          RENOVATE_DRY_RUN: ${{ inputs.dryRun && 'full' || '' }}
          # RENOVATE_FORCE overrides resolved config. Nulling both schedules
          # makes a manual run act immediately instead of deferring to the
          # overnight window — for catching up, or testing a config change
          # without waiting until 1am. It does NOT override automerge, so the
          # database and caddy-Dockerfile hold-backs still apply.
          RENOVATE_FORCE: ${{ inputs.ignoreSchedule && '{"schedule":null,"automergeSchedule":null}' || '' }}
          # RENOVATE_HOST_RULES comes from $GITHUB_ENV (Docker Hub step above);
          # setting it here would override that.
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
