name: Validate infrastructure

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  manifests:
    name: Helm and Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          # ArgoCD currently renders with Helm 3. Helm 4 dependency build has
          # an Authentik repository regression, so validate the same contract.
          #
          # Renovate reads this input as the `helm` dep (packageName helm/helm)
          # under the github-actions manager, and on 2026-08-03 it automerged
          # v3.21.3 -> v4.2.3 in PR #52 (commit b7bb4ca) — straight past the
          # comment above. CI then validated Helm 4 while ArgoCD rendered
          # Helm 3 for a week. Rule 9 in renovate.json now caps this <4.0.0;
          # lift that cap deliberately, together with this line, once ArgoCD
          # itself moves to Helm 4.
          version: v3.21.3
      - name: Validate version-controlled deployment artifacts
        run: scripts/validate-version-upgrades.sh

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.15.8
      - name: Check formatting
        run: terraform fmt -check -recursive
      - name: Initialize without remote state
        run: terraform init -backend=false -input=false
      - name: Validate configuration
        run: terraform validate
