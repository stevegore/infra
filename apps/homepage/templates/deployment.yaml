apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "homepage.fullname" . }}
  labels:
    {{- include "homepage.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "homepage.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "homepage.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "homepage.fullname" . }}
      {{- if .Values.topologySpread.enabled }}
      topologySpreadConstraints:
        # One pod per node. DoNotSchedule (not ScheduleAnyway) on purpose: on a
        # 2-node cluster, silently co-locating both replicas would leave a
        # single node drain taking the whole service down, which is exactly the
        # failure this replica is here to prevent. Better to sit Pending and be
        # visible.
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          # Scope the skew maths to this ReplicaSet only. Without it, the old
          # revision's pods are counted during a rolling update and both new
          # pods can legally land on one node: with old on A and new-1 on B the
          # skew is 0, so new-2 may also pick B (A=1 old, B=2 new is skew 1,
          # still legal) — and once the old pod goes away you are left at skew 2
          # with no rebalancing, because the constraint is only ever evaluated
          # at scheduling time. Observed exactly that on 2026-07-25: both
          # homepage pods ended up on 10.0.1.166.
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              {{- include "homepage.selectorLabels" . | nindent 14 }}
      {{- end }}
      initContainers:
        - name: copy-config
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ['sh', '-c', 'mkdir -p /app/config && cp -rL /config-source/. /app/config/']
          volumeMounts:
            - name: config-source
              mountPath: /config-source
              readOnly: true
            - name: config-work
              mountPath: /app/config
      containers:
        - name: homepage
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: {{ join "," .Values.allowedHosts | quote }}
          {{- if .Values.vault.enabled }}
          envFrom:
            - secretRef:
                name: {{ .Values.vault.portainer.secretName }}
                optional: true
          {{- end }}
          volumeMounts:
            - name: config-work
              mountPath: /app/config
            - name: logs
              mountPath: /app/config/logs
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config-source
          configMap:
            name: {{ include "homepage.fullname" . }}-config
        - name: config-work
          emptyDir: {}
        - name: logs
          emptyDir: {}
