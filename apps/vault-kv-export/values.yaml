# Nightly logical export of Vault's kv/ store, policies and mount config.
#
# WHY THIS EXISTS. Vault seals with `seal "ocikms"`, so every object in the
# `vault-storage` bucket is encrypted under a master key that only the OCI KMS
# key `vault-auto-unseal` can unwrap. That key is HSM-protected and — verified
# against the API on 2026-08-18 — **cannot be backed up**, because key backup
# requires a Virtual Private Vault and ours is `vault_type = "DEFAULT"`. A
# bucket backup is therefore worthless on its own: lose the key and the
# ciphertext is permanently undecryptable. This export is the only artefact
# that survives that failure. See vault.md → "The single point of failure is
# the KMS key".

image:
  # Built from docker/Dockerfile — hashicorp/vault (for the CLI) plus age.
  # Push with: bash scripts/build-vault-kv-export-image.sh
  repository: syd.ocir.io/sdajdczqv0qo/vault-kv-export
  tag: "0.1.0"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ocir-creds

# 03:20 UTC = 13:20 / 14:20 Sydney. Deliberately away from the CNPG
# `pg-shared-daily` window so two backup jobs don't contend for the one node.
schedule: "20 3 * * *"

# age encryption. This is a PUBLIC key and is not a secret — it can only
# encrypt. The matching private key is held offline by Steve and exists
# nowhere in this cluster, in Vault, or in OCI; that independence is the whole
# point, since anything stored in those places dies with the KMS key.
#
# Lose the private key and every blob this job has ever written is
# permanently unreadable. There is no recovery path and no second factor.
age:
  recipient: "age1ta662xl3qwvq5jq9s8mflkfvcn9d80lry9eay7we2hhe9dw4dfqsvchhqt"

vault:
  addr: http://vault.vault.svc.cluster.local:8200
  # k8s auth role the CronJob logs in as (created by
  # scripts/vault-kv-export-setup.sh). Distinct from the VSO role below: this
  # one can read all of kv/, so it is bound to this namespace's SA only.
  authRole: vault-kv-export
  mount: kv
  # VSO pulls these two into native k8s Secrets. They MUST come via VSO rather
  # than being read by the job itself: the job needs the Pushover credentials
  # precisely in the case where talking to Vault is what failed.
  vsoAuthRole: vault-secrets-operator
  par:
    path: oci/vault-kv-export
    secretName: vault-kv-export-par
  pushover:
    path: homelab/pushover
    secretName: vault-kv-export-pushover
  refreshAfter: 1h

upload:
  # Write-only pre-authenticated request (AnyObjectWrite) on the
  # `vault-kms-key-backup` bucket. A PAR rather than an S3 HMAC key because
  # OCI caps a user at 2 Customer Secret Keys and both are already spent on
  # caddy-acme and pg-backups — taking one would break Caddy's ACME store or
  # CNPG's WAL archiving. The PAR is also the better-scoped credential: it can
  # create objects but cannot read, list or delete them, which is exactly the
  # privilege an append-only backup job should hold.
  #
  # PARs expire. Rotation is by re-running scripts/vault-kv-export-setup.sh.
  # An expired PAR surfaces as an upload failure and pages via Pushover rather
  # than failing silently.
  objectPrefix: kv-export

resources:
  requests:
    memory: 64Mi
    cpu: 50m
  limits:
    memory: 256Mi
    cpu: 500m

# Keep a few runs visible for debugging, but not an unbounded pile.
successfulJobsHistoryLimit: 3
failedJobsHistoryLimit: 3
# A run takes seconds; 15 min is generous headroom before something is wrong.
activeDeadlineSeconds: 900
backoffLimit: 2
