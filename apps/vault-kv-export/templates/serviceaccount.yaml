# Identity the CronJob authenticates to Vault with, via the `kubernetes` auth
# mount. Deliberately its own ServiceAccount rather than `default`: the Vault
# role bound to it grants read over the whole of kv/, which is the broadest
# read privilege any workload in this cluster holds, so it should not be
# reachable by anything that merely happens to land in this namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "vault-kv-export.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vault-kv-export.labels" . | nindent 4 }}
automountServiceAccountToken: true
