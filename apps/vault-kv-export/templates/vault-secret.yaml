# VSO pulls the upload PAR and the Pushover credentials into native k8s
# Secrets in this namespace.
#
# Both are fetched by VSO rather than read by the job with its own Vault token,
# and that is deliberate: k8s Secrets survive Vault being down, and the job
# needs the Pushover credentials in exactly the case where talking to Vault is
# what failed. A job that could only alert when Vault was healthy would go
# silent during the outage worth paging for — the same way the bw2 sync sat
# dead for two months without anyone noticing.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: {{ include "vault-kv-export.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vault-kv-export.labels" . | nindent 4 }}
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: {{ .Values.vault.vsoAuthRole }}
    serviceAccount: default
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: {{ include "vault-kv-export.fullname" . }}-par
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vault-kv-export.labels" . | nindent 4 }}
spec:
  type: kv-v2
  mount: {{ .Values.vault.mount }}
  path: {{ .Values.vault.par.path }}
  destination:
    name: {{ .Values.vault.par.secretName }}
    create: true
  refreshAfter: {{ .Values.vault.refreshAfter }}
  vaultAuthRef: {{ include "vault-kv-export.fullname" . }}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: {{ include "vault-kv-export.fullname" . }}-pushover
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vault-kv-export.labels" . | nindent 4 }}
spec:
  type: kv-v2
  mount: {{ .Values.vault.mount }}
  path: {{ .Values.vault.pushover.path }}
  destination:
    name: {{ .Values.vault.pushover.secretName }}
    create: true
  refreshAfter: {{ .Values.vault.refreshAfter }}
  vaultAuthRef: {{ include "vault-kv-export.fullname" . }}
# No rolloutRestartTargets: a CronJob reads its Secrets fresh on every run, so
# there is no long-lived pod holding a stale value.
