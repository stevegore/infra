apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "caddy.fullname" . }}-config
  labels:
    {{- include "caddy.labels" . | nindent 4 }}
data:
  Caddyfile: |
    {
      email {{ .Values.acmeEmail }}

      # DNS-01 challenge via Cloudflare — bypasses the need for ACME validators
      # to reach port 80/443 on the OCI NLB (which has multi-perspective
      # validation timeouts from some geographic vantage points).
      acme_dns cloudflare {env.CF_API_TOKEN}

      # Shared ACME state across both replicas — OCI Object Storage via the
      # S3-compat endpoint. Without this, each replica would race for ACME
      # certs and burn Let's Encrypt rate limits.
      storage s3 {
        host {env.S3_HOST}
        bucket {env.S3_BUCKET}
        access_id {env.AWS_ACCESS_KEY_ID}
        secret_key {env.AWS_SECRET_ACCESS_KEY}
        prefix {env.S3_PREFIX}
      }

      servers :443 {
        name stevegore
        protocols h1 h2 h2c
        strict_sni_host on
      }

      log default {
        output stdout
        format json
        exclude http.log.access
        level INFO
      }

    }

    (defaults) {
      encode gzip
    }

    # Authentik domain-level forward-auth. Protected vhosts `import authentik`
    # plus a reverse_proxy for /outpost.goauthentik.io/* (the outpost's own
    # endpoints). Unauthenticated requests get 302'd to auth.stevegore.au; the
    # outpost returns identity headers on success. Replaces caddy-security.
    (authentik) {
      forward_auth authentik-server.authentik.svc.cluster.local:80 {
        uri /outpost.goauthentik.io/auth/caddy
        copy_headers X-Authentik-Username X-Authentik-Groups X-Authentik-Email X-Authentik-Name X-Authentik-Uid X-Authentik-Jwt X-Authentik-Meta-Jwks X-Authentik-Meta-Outpost X-Authentik-Meta-Provider X-Authentik-Meta-App X-Authentik-Meta-Version
        trusted_proxies private_ranges
      }
    }

    # ----- Authentik (IdP + forward-auth embedded outpost) -----

    auth.stevegore.au {
      reverse_proxy authentik-server.authentik.svc.cluster.local:80
      import defaults
    }

    # ----- Health -----

    healthz.stevegore.au {
      respond "OK"
    }

    # ----- In-cluster services -----

    vault.stevegore.au {
      # Vault handles its own GitHub auth on the UI; no caddy-security gate.
      reverse_proxy vault.vault.svc.cluster.local:8200
      import defaults
    }

    argocd.stevegore.au {
      # ArgoCD runs in --insecure mode (plain HTTP) — Caddy handles TLS termination
      reverse_proxy http://argocd-server.argocd.svc.cluster.local:80
    }

    # No grpc.argocd vhost. argocd-server (server.insecure=true) resets h2c
    # prior-knowledge connections, so that host only ever returned 502. The
    # supported path is gRPC-Web over the normal vhost, which works today:
    #   argocd login argocd.stevegore.au --grpc-web
    # Undefined subdomains land on the *.stevegore.au catch-all below.

    bw.stevegore.au {
      header / {
        Strict-Transport-Security "max-age=31536000;"
        X-XSS-Protection "1; mode=block"
        X-Frame-Options "DENY"
        X-Robots-Tag "none"
        -Server
      }
      # One upstream for everything, including /notifications/hub — Vaultwarden
      # 1.31.0+ multiplexes the websocket onto the main HTTP port. The old
      # split (hub -> :3012) silently 502'd every client's sync channel because
      # nothing binds 3012 any more; the web vault kept working, so it looked
      # fine. Caddy upgrades the websocket through this proxy on its own.
      reverse_proxy vaultwarden.vaultwarden.svc.cluster.local:80 {
        header_up X-Real-IP {remote_host}
      }
      import defaults
    }

    homepage.stevegore.au {
      reverse_proxy /outpost.goauthentik.io/* authentik-server.authentik.svc.cluster.local:80
      import authentik
      reverse_proxy homepage.homepage.svc.cluster.local:3000
      import defaults
    }

    uptime.stevegore.au {
      reverse_proxy uptime-kuma.uptime-kuma.svc.cluster.local:3001
      import defaults
    }

    # Custom-domain alias for the public 'homelab' status page. Uptime Kuma
    # serves the right page at / based on Host header via status_page_cname
    # (managed by scripts/setup_status_page.py).
    status.stevegore.au {
      reverse_proxy uptime-kuma.uptime-kuma.svc.cluster.local:3001
      import defaults
    }

    adminer.stevegore.au {
      reverse_proxy /outpost.goauthentik.io/* authentik-server.authentik.svc.cluster.local:80
      import authentik
      reverse_proxy adminer.adminer.svc.cluster.local:80
      import defaults
    }

    headlamp.stevegore.au {
      reverse_proxy /outpost.goauthentik.io/* authentik-server.authentik.svc.cluster.local:80
      import authentik
      reverse_proxy headlamp.headlamp.svc.cluster.local:80
      import defaults
    }

    # Cilium network-flow observability. Hubble UI has no native authentication.
    hubble.stevegore.au {
      reverse_proxy /outpost.goauthentik.io/* authentik-server.authentik.svc.cluster.local:80
      import authentik
      reverse_proxy hubble-ui.kube-system.svc.cluster.local:80
      import defaults
    }

    # ----- Pico-hosted services (via Tailscale Egress Service) -----
    # `pico` resolves to the in-namespace ExternalName Service created by the
    # Tailscale operator (see templates/pico-egress.yaml). The operator runs a
    # proxy pod that forwards each port over the tailnet to pico's MagicDNS
    # name. No 10.20.30.0/24 dependency; no need to know the tailnet name
    # here — it lives only in values.yaml.

    hass.stevegore.au {
      reverse_proxy pico:8123
      import defaults
    }

    desk.stevegore.au {
      reverse_proxy /outpost.goauthentik.io/* authentik-server.authentik.svc.cluster.local:80
      import authentik
      reverse_proxy pico:8111
      import defaults
    }

    gym.stevegore.au {
      reverse_proxy /outpost.goauthentik.io/* authentik-server.authentik.svc.cluster.local:80
      import authentik
      reverse_proxy gym-booker.gym-booker.svc.cluster.local:5000
      import defaults
    }

    plex.stevegore.au {
      reverse_proxy pico:32400
      import defaults
    }

    # Gokapi file sharing. Upload a file, hand out the link, the link dies
    # after N downloads or a deadline.
    #
    # Auth is applied per-path, not to the whole vhost: the point of the service
    # is that recipients — who have no Authentik account — can fetch the file.
    # The @admin matcher is Gokapi's own requireLogin() route set, copied from
    # internal/webserver/Webserver.go. Keep it in sync when upgrading Gokapi;
    # a route missing here is not an auth bypass (Gokapi still enforces the
    # header itself and would 401) but it does turn a clean login redirect into
    # an error page.
    #
    # SECURITY — the `route` block is deliberate, do not flatten it. Gokapi
    # trusts X-Authentik-Username without checking which peer sent it and
    # auto-creates whatever username it finds (see apps/gokapi/values.yaml), so
    # a forged header must never survive to the upstream. `route` forces the
    # strip to execute BEFORE forward_auth re-adds the authenticated value —
    # in Caddy's default directive order request_header sorts *after*
    # forward_auth, so without `route` this would delete the real header and
    # break admin access instead of protecting it.
    send.stevegore.au {
      # Must be a `handle`, not a bare path-matched reverse_proxy as in the
      # other vhosts: `handle` sorts ahead of `reverse_proxy` in the directive
      # order, so the catch-all handle below would otherwise swallow the
      # outpost callback and break the Authentik redirect loop.
      handle /outpost.goauthentik.io/* {
        reverse_proxy authentik-server.authentik.svc.cluster.local:80
      }

      # The bare domain is only ever visited by you — recipients get deep links
      # to /d/<id>. Gokapi's own landing page just bounces anonymous visitors to
      # its RedirectUrl, which made send.stevegore.au a dead end, so send the
      # root straight to the upload page instead. Must be a `handle`: `redir`
      # sorts after `handle` in the directive order, so a bare `redir` here
      # would never be reached past the catch-all below.
      handle / {
        redir * /admin
      }

      @admin path /admin /apiKeys /auth/token /changePassword /downloadPresigned /e2eSetup /filerequests /logs /uploadChunk /uploadStatus /users
      handle @admin {
        route {
          request_header -X-Authentik-Username
          import authentik
          reverse_proxy gokapi.gokapi.svc.cluster.local:53842
        }
      }

      # Public surface: download pages (/d, /dh), hotlinks (/h), the wasm
      # bundles, static assets, and /publicUpload for file-request uploads.
      handle {
        request_header -X-Authentik-Username
        reverse_proxy gokapi.gokapi.svc.cluster.local:53842
      }

      import defaults
    }

    immich.stevegore.au {
      reverse_proxy pico:2283
      import defaults
    }

    port.stevegore.au {
      reverse_proxy pico:9000
      import defaults
    }

    huginn.stevegore.au {
      reverse_proxy pico:3000
      import defaults
    }

    pdf.stevegore.au {
      reverse_proxy pico:8083
    }

    strava.stevegore.au {
      reverse_proxy strava-keeper.strava-keeper.svc.cluster.local:8180
    }

    # Garmin MCP server for Claude (remote connector). Gated by a secret URL
    # path instead of forward_auth — Claude's connector UI can't do OAuth
    # against Authentik or send custom headers. {$GARMIN_MCP_PATH_SECRET} is
    # substituted at Caddyfile parse time from the caddy-config secret
    # (kv/caddy/config → garmin_mcp_path_secret), so it never appears in git.
    # Connector URL: https://garmin.stevegore.au/<secret>/mcp
    garmin.stevegore.au {
      handle_path /{$GARMIN_MCP_PATH_SECRET}/* {
        reverse_proxy garmin-mcp.garmin-mcp.svc.cluster.local:8080
      }
      respond 404
    }

    stats.stevegore.au {
      reverse_proxy pico:8001
      import defaults
    }

    photos.stevegore.au {
      reverse_proxy pico:2283
      import defaults
    }

    # Static masonry grid of a saved Instagram collection, generated by
    # scripts/build-gallery.py and served by the `ig-gallery` nginx stack on
    # pico. Public by choice (no `import authentik`), but it is a rehost of
    # other accounts' photos, so keep crawlers off it explicitly — the
    # generated HTML also carries a robots meta tag, which crawlers may ignore.
    gallery.stevegore.au {
      header X-Robots-Tag "noindex, nofollow"
      # Thumbnails are content-stable for a given filename, and nginx only sends
      # ETag/Last-Modified — so without this every revisit revalidates all 3,110
      # of them, each paying the ~95ms pico→tailscale→OKE round trip. Cache hard.
      # A rebuild that changes an image reuses its filename, so bump this (or
      # rename) if you ever need viewers to pick up changed pixels sooner.
      header /thumbs/* Cache-Control "public, max-age=2592000"
      # HTML and the hide-list stylesheet must stay fresh: they are how new
      # photos become visible and curated photos disappear. Needs to match bare
      # `/` too — nginx resolves that to index.html internally, but Caddy
      # matches on the request path, so `/index.html` alone misses normal visits.
      @nocache path / /index.html /admin.html /hidden.css
      header @nocache Cache-Control "no-cache"
      reverse_proxy pico:8090
      import defaults
    }

    stevegore.au {
      respond /health "I'm doing ok, thanks for asking :)"
      respond /healthz "I'm doing ok, thanks for asking :)"
      # Retries exist here and NOWHERE ELSE in this file, on purpose.
      #
      # ttyd is restarted every 30 minutes by its own restarter CronJob
      # (apps/ttyd/templates/cronjob.yaml). A readinessProbe fixed the rollout
      # ORDER, but a ~10s hole remains after the old pod dies while the
      # ClusterIP is reprogrammed, and new dials are black-holed to the dead
      # pod's IP — surfacing as "dial tcp 10.96.24.184:8788: i/o timeout" and a
      # 502. See the KNOWN RESIDUAL note in apps/ttyd/values.yaml; a preStop
      # drain was tried and reverted because it only moved the hole.
      #
      # Caddy does NOT retry by default: with lb_try_duration and lb_retries
      # both 0, tryAgain() returns immediately even for a failed dial. Setting
      # either one turns retries on, and "if the connection to the upstream
      # failed, a retry is always allowed" regardless of method — which is
      # exactly this failure. Both bounds are set; whichever trips first wins.
      # A dial takes ~3s to time out, so 5 retries inside 20s covers the hole.
      #
      # Deliberately NOT set: fail_duration. Passive health checking with a
      # single upstream would mark the only backend down and fail fast with
      # "no upstreams available" — the opposite of what we want here.
      #
      # Do not generalise this to other vhosts. Retrying a genuinely-down
      # backend converts a fast 502 into a 20s hang and hides real outages
      # from Uptime Kuma. This vhost earns it because the outage is
      # self-inflicted, brief, and on a known schedule.
      reverse_proxy ttyd.ttyd.svc.cluster.local:8788 {
        lb_retries 5
        lb_try_duration 20s
        lb_try_interval 500ms
      }
      import defaults
    }

    # Catch-all for undefined subdomains — MUST stay last for readability, though
    # Caddy matches on specificity rather than order, so every explicit vhost
    # above still wins.
    #
    # `*.stevegore.au` is a wildcard DNS record, so a retired service (hermes,
    # photoprism) keeps resolving here long after its vhost is gone. Without this
    # block Caddy has no certificate for the name and aborts the TLS handshake —
    # which reads as "the whole site is down" rather than "that service is gone".
    # The wildcard cert is issued through the same Cloudflare DNS-01 flow.
    #
    # Only matches a single label, so the apex is unaffected — and so is anything
    # deeper like `a.b.stevegore.au`, which gets no cert and a failed handshake
    # rather than this 404. Nothing multi-label is published; if that changes,
    # the name needs its own vhost or a second wildcard.
    *.stevegore.au {
      import defaults
      respond "Not all who wander are lost, but you probably are." 404
    }
