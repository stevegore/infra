apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "garmin-mcp.fullname" . }}
  labels:
    {{- include "garmin-mcp.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "garmin-mcp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "garmin-mcp.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        # Seed the token file from Vault when absent or when the Vault seed
        # has changed since it was last seeded (i.e. freshly minted tokens
        # were put in Vault). An unchanged seed never clobbers the newer
        # tokens garminconnect has refreshed in place on the PVC.
        - name: seed-tokens
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              D=/data/garmintokens
              mkdir -p "$D"
              NEW=$(sha256sum /seed/GARMIN_TOKENS_JSON | cut -d' ' -f1)
              OLD=$(cat "$D/.seed.sha256" 2>/dev/null || true)
              if [ ! -f "$D/garmin_tokens.json" ] || [ "$NEW" != "$OLD" ]; then
                cp /seed/GARMIN_TOKENS_JSON "$D/garmin_tokens.json"
                echo "$NEW" > "$D/.seed.sha256"
                rm -f "$D/.credential_login_state.json"
                echo "Seeded garmin_tokens.json from Vault secret"
              else
                echo "Vault seed unchanged; keeping refreshed token file"
              fi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: token-seed
              mountPath: /seed
              readOnly: true
      containers:
        - name: garmin-mcp
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: GARMINTOKENS
              value: /data/garmintokens
            # Read by the launcher to re-mint tokens when Garmin rejects the
            # refresh token (account has no MFA). Files, not env values, so the
            # password stays out of `kubectl describe` / process environ.
            - name: GARMIN_EMAIL_FILE
              value: /credentials/GARMIN_USERNAME
            - name: GARMIN_PASSWORD_FILE
              value: /credentials/GARMIN_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /data
            - name: credentials
              mountPath: /credentials
              readOnly: true
          readinessProbe:
            httpGet:
              path: /status
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "garmin-mcp.fullname" . }}-data
        - name: token-seed
          secret:
            secretName: {{ .Values.vault.secretName }}
            items:
              - key: GARMIN_TOKENS_JSON
                path: GARMIN_TOKENS_JSON
        - name: credentials
          secret:
            secretName: {{ .Values.vault.secretName }}
            items:
              - key: GARMIN_USERNAME
                path: GARMIN_USERNAME
              - key: GARMIN_PASSWORD
                path: GARMIN_PASSWORD
