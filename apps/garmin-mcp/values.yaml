# Stays at 1, and gets no PodDisruptionBudget.
#
# Single-writer by construction: python-garminconnect refreshes the Garmin OAuth
# tokens *in place* on the PVC below, and Garmin rotates the refresh token on
# every use. Two pods refreshing against the same garmin_tokens.json would
# invalidate each other's token, and each would then fall back to a full
# credential login, fighting over the token file.
# The PVC is also claimed ReadWriteOnce, so a second pod would not schedule to
# the other node anyway.
#
# No PDB: minAvailable: 1 on one replica means no eviction is ever permitted and
# node drains hang. This is an on-demand MCP endpoint; a gap while it moves
# nodes costs nothing.
replicaCount: 0  # TEMP 2026-10-04: Garmin demands MFA on credential login; stops crash-loop login attempts

image:
  repository: syd.ocir.io/sdajdczqv0qo/garmin-mcp
  tag: "0.2.0"
  pullPolicy: IfNotPresent

# OCIR pull secret — manual bootstrap once after the namespace first syncs
# (same pattern as caddy):
#   kubectl -n garmin-mcp create secret docker-registry ocir-creds \
#     --docker-server=syd.ocir.io \
#     --docker-username='sdajdczqv0qo/oracleidentitycloudservice/steve.j.gore@gmail.com' \
#     --docker-password="$(vault kv get -field=auth_token kv/oci/ocir)"
imagePullSecrets:
  - name: ocir-creds

resources:
  requests:
    memory: 128Mi
    cpu: 25m
  limits:
    memory: 512Mi
    cpu: 250m

service:
  type: ClusterIP
  port: 8080

# Garmin OAuth tokens live on the PVC (refreshed in place by garminconnect).
# The init container seeds them from the Vault-synced secret only when absent.
# oci-fss (not oci-bv): the token file is a few KB, but OCI block volumes have a
# 50 GB minimum that counts against the 200 GB Always-Free boot+block cap. FSS
# bills on actual usage under the separate, unused 100 GB FSS free allotment, so
# this PVC is $0. Pod runs as root, so the FSS non-root-write gotcha doesn't bite.
persistence:
  size: 1Gi
  storageClass: oci-fss

# VSO config — secret at kv/garmin-mcp/config with fields:
#   GARMIN_USERNAME / GARMIN_PASSWORD — Garmin login (account has no MFA). The
#                        launcher logs in with these whenever the refresh token
#                        is rejected, so tokens never need manual renewal.
#   GARMIN_TOKENS_JSON — optional initial seed / MFA escape hatch: contents of
#                        garmin_tokens.json from `garmin-mcp-auth` (see README).
vault:
  enabled: true
  mount: kv
  path: garmin-mcp/config
  refreshAfter: 1h
  authRole: vault-secrets-operator
  secretName: garmin-mcp-config
