apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "ttyd.fullname" . }}-restarter
  labels:
    {{- include "ttyd.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.restarter.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: {{ include "ttyd.fullname" . }}-restarter
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            # The upstream distroless kubectl image declares USER 0, so
            # runAsNonRoot alone would be rejected at admission ("container has
            # runAsNonRoot and image will run as root"). Run as the image's own
            # `nonroot` account instead — see the comment on restarter.image.
            runAsUser: {{ .Values.restarter.runAsUser }}
            runAsGroup: {{ .Values.restarter.runAsGroup }}
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: kubectl
              image: {{ .Values.restarter.image }}
              command:
                - kubectl
                - rollout
                - restart
                - deployment/{{ include "ttyd.fullname" . }}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
