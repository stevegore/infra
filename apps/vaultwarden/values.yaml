# Vaultwarden — OKE primary, MySQL HeatWave Free backend, /data ephemeral.
# See architecture-proposal.md §7.1 + §7.1.1.

replicaCount: 1  # Vaultwarden has no native HA; one writer.

image:
  # FQ image name required by cri-o on OKE workers (short names rejected).
  repository: docker.io/vaultwarden/server
  tag: "1.37.1-alpine"
  pullPolicy: IfNotPresent

resources:
  requests:
    memory: 128Mi
    cpu: 50m
  limits:
    memory: 512Mi
    cpu: 500m

service:
  type: ClusterIP
  # Caddy fronts external traffic at bw.stevegore.au; nothing else needs to
  # talk to Vaultwarden, so ClusterIP is enough.
  #
  # One port only. Vaultwarden used to serve the notifications hub on a separate
  # 3012 listener; since 1.31.0 it is multiplexed onto the main HTTP port at
  # /notifications/hub and WEBSOCKET_ENABLED is a no-op. Keeping the old port
  # declared cost us a live outage: Caddy proxied /notifications/hub to :3012,
  # nothing listened there, and every Bitwarden client got 502 on its sync
  # channel while the web vault looked perfectly healthy.
  webPort: 80          # web vault + API + notifications hub

# Public URL — Vaultwarden generates email links and CORS off this.
domain: https://bw.stevegore.au

config:
  signupsAllowed: false
  invitationsAllowed: false
  webVaultEnabled: true
  logLevel: info

# JWT signing key persistence.
#
# Vaultwarden signs client access/refresh tokens with /data/rsa_key.pem and
# generates a new one whenever the file is missing. With /data on an emptyDir
# (§7.1) that happened on every single pod start, so every Helm change logged
# every device out of every Bitwarden client. §7.1 accepted a one-off re-auth
# "on cutover"; what it missed is that a rollout is not a rare event.
#
# Rather than reintroduce the 50 GB block-volume PVC that §7.1 deliberately
# gave up (the whole file is 1675 bytes), the key is stored as the `rsa_key`
# field of kv/vaultwarden/config and restored by an init container. That also
# makes it survive node loss and full cluster rebuilds, which a PVC would not.
#
# To seed or rotate it (rotating logs everyone out once, by design):
#   export VAULT_ADDR=https://vault.stevegore.au
#   openssl genrsa -traditional -out rsa_key.pem 2048   # PKCS#1, as VW writes
#   vault kv patch kv/vaultwarden/config rsa_key=@rsa_key.pem && rm rsa_key.pem
# `patch`, never `put` — put would drop database_url and admin_token.
#
# Safe to leave true when Vault has no key: the mount is optional, so the pod
# still starts and simply falls back to generating an ephemeral one.
jwtKey:
  restoreFromVault: true

# VSO config — secrets live at kv/vaultwarden/config with fields:
#   database_url  — mysql://vaultwarden:<pw>@<mysql-private-endpoint>:3306/vaultwarden
#   admin_token   — argon2-hashed token for /admin (optional)
#   rsa_key       — PEM (PKCS#1) JWT signing key, see jwtKey above (optional)
vault:
  enabled: true
  mount: kv
  path: vaultwarden/config
  refreshAfter: 1h
  authRole: vault-secrets-operator
  secretName: vaultwarden-config
