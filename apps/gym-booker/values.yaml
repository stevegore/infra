# Keep a single scheduler replica: concurrent schedulers can book the same class.
# Non-secret state is in MySQL; the legacy PVC is retained for migration/rollback.
replicaCount: 0

image:
  repository: syd.ocir.io/sdajdczqv0qo/gym-booker
  tag: "a853eaf4cd3e1d61faba76c9db3354818c332834"
  pullPolicy: IfNotPresent

# OCIR pull secret — manual bootstrap once after the namespace first syncs
# (same pattern as garmin-mcp):
#   kubectl -n gym-booker create secret docker-registry ocir-creds \
#     --docker-server=syd.ocir.io \
#     --docker-username='sdajdczqv0qo/oracleidentitycloudservice/steve.j.gore@gmail.com' \
#     --docker-password="$(vault kv get -field=auth_token kv/oci/ocir)"
imagePullSecrets:
  - name: ocir-creds

resources:
  requests:
    memory: 64Mi
    cpu: 25m
  limits:
    memory: 256Mi
    cpu: 250m

service:
  type: ClusterIP
  port: 5000

# Legacy state retained for migration/rollback. New pods do not mount this claim.
# Do not remove it until MySQL migration and backups have been verified.
persistence:
  size: 1Gi
  storageClass: oci-fss

# VSO config at kv/gym-booker/config:
# USERS_YAML: stable user-name references + gym credentials + Pushover tokens only.
# MYSQL_DSN, FLASK_SECRET_KEY, ADMIN_PASSWORD: injected as environment variables.
# Profiles, schedules and cancellation exclusions must be migrated to MySQL before
# deploying the new image. See gym-booker/MIGRATION.md for the ordered cutover.
vault:
  enabled: true
  mount: kv
  path: gym-booker/config
  refreshAfter: 1m
  authRole: vault-secrets-operator
  secretName: gym-booker-config

# One-time migration. Enable only while replicaCount is zero; source is read-only.
migration:
  enabled: true
  statePath: /var/elixr
  adminUser: steve
