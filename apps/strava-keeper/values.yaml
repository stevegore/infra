replicaCount: 1

image:
  repository: docker.io/stevegore/stravakeeper
  # Pinned to the git-SHA tag that `latest` currently resolves to (pushed
  # 2026-06-13, index digest sha256:a2590377…). Rebuilds push a commit-SHA tag
  # alongside `latest`, so pinning here means a pod reschedule can't quietly
  # swap in an untested build — bump the SHA when you actually want the new one.
  # The index is arm64-only (manifest sha256:db35efab…), which is what the
  # aarch64 A1.Flex worker nodes need; do not assume amd64 exists.
  tag: "90f6c41c9df5d5203e49759e5641449bb6eb46dc"
  pullPolicy: Always

resources:
  requests:
    memory: 64Mi
    cpu: 25m
  limits:
    memory: 256Mi
    cpu: 250m

service:
  type: ClusterIP
  port: 8180

env:
  stravaRedirectUrl: "https://strava.stevegore.au/oauth-callback"
  stravaValidationUrl: "https://strava.stevegore.au/webhook"

# VSO config — secrets at kv/strava-keeper/config with fields:
#   STRAVA_CLIENT_ID      — Strava app numeric client ID
#   STRAVA_CLIENT_SECRET  — Strava app secret
#   STRAVA_VERIFY_TOKEN   — webhook verification token
#   MYSQL_DSN             — go-sql-driver DSN, e.g. user:pass@tcp(host:3306)/db?parseTime=true
vault:
  enabled: true
  mount: kv
  path: strava-keeper/config
  refreshAfter: 1h
  authRole: vault-secrets-operator
  secretName: strava-keeper-config
